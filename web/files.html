<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafirOS Files</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#111;color:#ddd;font-family:system-ui,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:24px}
h1{margin-top:0}
.panel{background:#1a1a1a;border:1px solid #444;border-radius:8px;padding:16px;margin-bottom:14px}
button{color:#fff;background:#292929;border:1px solid #666;border-radius:6px;padding:8px 12px;cursor:pointer}
input{max-width:100%}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #333}
.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12px;color:#999}
</style>
</head>
<body>
<div class="wrap">
<h1>SafirOS Files</h1>
<div class="panel">
<input id="picker" type="file" multiple>
<button id="upload">Import</button>
<button id="clear">Delete All</button>
<p class="meta">ファイルはこのブラウザのIndexedDBに保存します。サーバーにはアップロードしません。</p>
</div>
<div id="list" class="panel"></div>
</div>
<script>
"use strict";
const DB="safiros-files";
const STORE="files";
const dbp=new Promise((resolve,reject)=>{
 const r=indexedDB.open(DB,1);
 r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});
 r.onsuccess=()=>resolve(r.result);
 r.onerror=()=>reject(r.error);
});
async function tx(mode,fn){
 const db=await dbp;
 return new Promise((resolve,reject)=>{
  const t=db.transaction(STORE,mode), s=t.objectStore(STORE);
  const out=fn(s);
  t.oncomplete=()=>resolve(out);
  t.onerror=()=>reject(t.error);
 });
}
async function all(){
 const db=await dbp;
 return new Promise((resolve,reject)=>{
  const r=db.transaction(STORE).objectStore(STORE).getAll();
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>reject(r.error);
 });
}
function fmt(n){return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB"}
async function render(){
 const list=document.getElementById("list");
 const rows=await all();
 if(!rows.length){list.innerHTML="<p class='meta'>ファイルなし</p>";return}
 list.innerHTML="";
 for(const f of rows){
  const row=document.createElement("div"); row.className="row";
  const name=document.createElement("div"); name.className="name"; name.textContent=f.name;
  const meta=document.createElement("div"); meta.className="meta"; meta.textContent=fmt(f.size);
  const dl=document.createElement("button"); dl.textContent="Download";
  dl.onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(f.blob);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
  const del=document.createElement("button"); del.textContent="Delete";
  del.onclick=async()=>{await tx("readwrite",s=>s.delete(f.id));render()};
  row.append(name,meta,dl,del); list.append(row);
 }
}
document.getElementById("upload").onclick=async()=>{
 const files=[...document.getElementById("picker").files];
 for(const f of files) await tx("readwrite",s=>s.add({name:f.name,size:f.size,type:f.type,blob:f}));
 document.getElementById("picker").value="";
 render();
};
document.getElementById("clear").onclick=async()=>{
 if(!confirm("保存ファイルをすべて削除しますか？"))return;
 for(const f of await all()) await tx("readwrite",s=>s.delete(f.id));
 render();
};
render();
</script>
</body>
</html>
