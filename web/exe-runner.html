<!doctype html>
<html lang="ja">
<head>

<title>SafirOS EXE Runner</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#101010;color:#ddd;font-family:system-ui,sans-serif}

<header>

<main>

<iframe src="https://www.boxedwine.org/app/wine-shell/" title="Boxedwine WINE shell" allow="fullscreen"></iframe>
