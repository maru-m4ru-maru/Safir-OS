<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SafirOS</title>

  <link rel="icon" href="favicon.svg?v=5" type="image/svg+xml">
  <link rel="shortcut icon" href="favicon.svg?v=5">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/v86@0.5.458/build/libv86.js"></script>
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>SAFIROS</h1>
      <p class="subtitle">Web-based SafirOS emulator</p>
    </header>

    <section class="panel">

      <div class="panel-header">
        SYSTEM STATUS
      </div>

      <div class="status-area">

        <div id="status" class="status">
          SafirOSを起動しています...
        </div>

        <div class="progress-container">
          <div
            id="progress_bar"
            class="progress-bar"
            style="width: 0%;"
          ></div>
        </div>

        <div id="progress_text" class="progress-text">
          0%
        </div>

      </div>

    </section>

    <section class="panel">

      <div class="panel-header">
        VIRTUAL MACHINE
      </div>

      <div id="screen_container"></div>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
