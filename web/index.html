<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d15">
<meta name="color-scheme" content="dark">
<title>SafirOS — Web Terminal</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="terminal/xterm.css" as="style">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="terminal/xterm.css">
<script defer src="coi-serviceworker.js"></script>
<script defer src="./qemu/xterm-pty.js"></script>
<script defer src="terminal/xterm.js"></script>
<script defer src="terminal/addon-fit.js"></script>
<script defer src="ime-input-fix.js"></script>
<script>
window.SAFIROS_BASE=location.pathname.includes("/web/")?"../":"./";
window.Module={
  arguments:[
    "-M","pc",
    "-m","64M",
    "-accel","tcg,tb-size=500",
    "-L","/pack-rom/",
    "-boot","order=a",
    "-drive","file=/SafirOS.img,format=raw,if=floppy",
    "-serial","stdio",
    "-monitor","none",
    "-nographic",
    "-nic","none",
    "-no-reboot"
  ],
  locateFile(path){
    return window.SAFIROS_BASE+"qemu/"+path;
  },
  mainScriptUrlOrBlob:new URL("./qemu/out.js",location.href).href
};
</script>
<script>
window.SAFIROS_ROM_READY=new Promise((resolve,reject)=>{
  const script=document.createElement("script");
  script.src=window.SAFIROS_BASE+"qemu/load-rom.js";
  script.onload=resolve;
  script.onerror=()=>reject(new Error("Failed to load QEMU ROM loader"));
  document.head.appendChild(script);
});

window.addEventListener("error",event=>{
  const message=event.error&&event.error.message
    ?event.error.message
    :event.message;
  const status=document.getElementById("footer_status");
  const subtitle=document.getElementById("boot_subtitle");
  if(message){
    if(status) status.textContent="Browser error: "+message;
    if(subtitle) subtitle.textContent="Browser error: "+message;
  }
});

window.addEventListener("unhandledrejection",event=>{
  const reason=event.reason&&event.reason.message
    ?event.reason.message
    :String(event.reason);
  const status=document.getElementById("footer_status");
  const subtitle=document.getElementById("boot_subtitle");
  if(status) status.textContent="Startup error: "+reason;
  if(subtitle) subtitle.textContent="Startup error: "+reason;
});
</script>
</head>
<body>
<div id="app_shell">
  <header id="topbar">
    <a class="brand" href="./" aria-label="SafirOS home">
      <img src="safiros-logo.svg" alt="" width="27" height="24">
      <span class="brand-name">SafirOS</span>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-section">WEB TERMINAL</span>
    </a>
    <div class="topbar-right">
      <span class="system-chip">x86_64</span>
      <div id="runtime_state" data-state="starting" role="status" aria-live="polite">
        <span class="state-dot" aria-hidden="true"></span>
        <span id="runtime_label">Starting</span>
      </div>
    </div>
  </header>

  <div id="progress_track" aria-hidden="true">
    <div id="progress_bar"></div>
  </div>

  <main id="workspace">
    <section id="terminal_panel" aria-label="SafirOS terminal">
      <div id="terminal_toolbar">
        <div class="terminal-caption">
          <span class="terminal-indicator" aria-hidden="true"></span>
          <span>Console</span>
        </div>
        <span id="terminal_dimensions">80 × 24</span>
      </div>

      <div id="terminal_mount" tabindex="0" aria-label="SafirOS terminal output and input">
        <section id="boot_screen" role="status" aria-live="polite">
          <img class="boot-logo" src="safiros-logo.svg" alt="" width="52" height="45">
          <h1>SafirOS Web Terminal</h1>
          <p class="boot-description">Starting the x86-64 environment</p>
          <div class="boot-status">
            <span class="state-dot" aria-hidden="true"></span>
            <span id="boot_subtitle">Preparing the terminal</span>
          </div>
        </section>
      </div>
    </section>
  </main>

  <footer id="bottombar">
    <span class="footer-platform">QEMU TCG <span aria-hidden="true">/</span> x86_64</span>
    <span id="footer_status">Preparing the virtual machine</span>
  </footer>
</div>
<script defer src="app.js"></script>
</body>
</html>
