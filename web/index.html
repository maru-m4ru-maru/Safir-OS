<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Safir OS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="terminal/xterm.css">
<script defer src="coi-serviceworker.js"></script>
<script defer src="./qemu/xterm-pty.js"></script>
<script defer src="terminal/xterm.js"></script>
<script>
window.SAFIROS_BASE=location.pathname.includes("/web/")?"../":"./";
window.Module={
  arguments:[
    "-M","pc",
    "-m","64M",
    "-accel","tcg,tb-size=500",
    "-L","/pack-rom/",
    "-boot","order=a",
    "-drive","file=/SafirOS.img,format=raw,if=floppy",
    "-serial","stdio",
    "-monitor","none",
    "-nographic",
    "-nic","none",
    "-no-reboot"
  ],
  locateFile(path){
    return window.SAFIROS_BASE+"qemu/"+path;
  },
  mainScriptUrlOrBlob:new URL("./qemu/out.js",location.href).href
};
</script>
<script>
window.SAFIROS_ROM_READY=null;
window.loadSafirosRom=()=>{
  if(!window.SAFIROS_ROM_READY){
    window.SAFIROS_ROM_READY=new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      script.src=window.SAFIROS_BASE+"qemu/load-rom.js";
      script.onload=resolve;
      script.onerror=()=>reject(new Error("Failed to load QEMU ROM loader"));
      document.head.appendChild(script);
    });
  }

  return window.SAFIROS_ROM_READY;
};

window.addEventListener("error",event=>{
  const message=event.error&&event.error.message
    ?event.error.message
    :event.message;
  const status=document.getElementById("status");
  const subtitle=document.getElementById("boot_subtitle");
  if(message){
    if(status) status.textContent="Browser error: "+message;
    if(subtitle) subtitle.textContent="Browser error: "+message;
  }
});

window.addEventListener("unhandledrejection",event=>{
  const reason=event.reason&&event.reason.message
    ?event.reason.message
    :String(event.reason);
  const status=document.getElementById("status");
  const subtitle=document.getElementById("boot_subtitle");
  if(status) status.textContent="Startup error: "+reason;
  if(subtitle) subtitle.textContent="Startup error: "+reason;
});
</script>
</head>
<body>
<main id="terminal_mount" tabindex="0" aria-label="Safir OS terminal"></main>
<div id="status" hidden></div>
<div id="progress_bar" hidden></div>
<div id="runtime_state" hidden><span id="runtime_label"></span></div>
<div id="boot_screen" hidden><div id="boot_subtitle"></div></div>
<script defer src="app.js"></script>
</body>
</html>
