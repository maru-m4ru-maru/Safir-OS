<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safir OS</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="coi-serviceworker.js"></script>
<script>
window.Module={
  arguments:[
    "-M","pc",
    "-m","64M",
    "-accel","tcg,tb-size=500",
    "-L","/pack-rom/",
    "-boot","order=a",
    "-fda","/SafirOS.img",
    "-serial","stdio",
    "-monitor","none",
    "-display","none",
    "-nic","none",
    "-no-reboot"
  ],
  locateFile(path){
    return "./qemu/"+path;
  },
  mainScriptUrlOrBlob:new URL("./qemu/out.js",location.href).href
};
</script>
<script src="qemu/load-rom.js"></script>
</head>
<body>
<div id="boot_screen">
  <img class="safiros_logo" src="safiros-logo.svg" alt="Safir OS">
  <div id="boot_title">Safir OS</div>
  <div id="status">Safir OSを起動しています...</div>
  <div class="progress"><div id="progress_bar"></div></div>
</div>
<div id="screen_container" aria-label="Safir OS">
  <pre id="serial_console"></pre>
</div>
<script src="app.js"></script>
</body>
</html>
