name: Build SafirOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 binutils lld

      - name: Build bootloader
        run: |
          mkdir -p build
          nasm -f bin boot/boot.asm -o build/boot.bin
          nasm -dSAFIROS_QEMU_TEST -f bin boot/boot.asm -o build/boot-qemu.bin
          test "$(stat -c%s build/boot-qemu.bin)" -eq 512

      - name: Test browser PTY line discipline
        run: node scripts/test-web-pty.cjs

      - name: Test xterm IME textarea diff handling
        run: node scripts/test-xterm-ime-fix.cjs

      - name: Test COI service-worker lifecycle
        run: node scripts/test-coi-serviceworker.cjs

      - name: Test Rust kernel logic
        run: |
          cargo test --features host-test --lib --manifest-path kernel/rust/Cargo.toml

      - name: Property test RingBuffer
        run: |
          cargo test \
            --features host-test \
            --test ring_buffer_property \
            --manifest-path kernel/rust/Cargo.toml

      - name: Property test Scheduler
        run: |
          cargo test \
            --features host-test \
            --test scheduler_property \
            --manifest-path kernel/rust/Cargo.toml

      - name: Property test Task
        run: |
          cargo test \
            --features host-test \
            --test task_property \
            --manifest-path kernel/rust/Cargo.toml

      - name: Property test Preemption
        run: |
          cargo test \
            --features host-test \
            --test preemption_property \
            --manifest-path kernel/rust/Cargo.toml

      - name: Verify Dafny specifications
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"

      - name: Dafny verify
        run: |
          dafny verify verification/bitmap.dfy
          dafny audit verification/bitmap.dfy
          dafny verify verification/frame_allocator.dfy
          dafny audit verification/frame_allocator.dfy
          dafny verify verification/pmm.dfy
          dafny audit verification/pmm.dfy
          dafny verify verification/ring_buffer.dfy
          dafny audit verification/ring_buffer.dfy
          dafny verify verification/scheduler.dfy
          dafny audit verification/scheduler.dfy
          dafny verify verification/task.dfy
          dafny audit verification/task.dfy

      - name: Differential test Dafny vs Rust bitmap
        run: |
          bash scripts/test-bitmap-differential.sh

      - name: Differential test Dafny vs Rust frame allocator
        run: |
          bash scripts/test-frame-differential.sh

      - name: Differential test Dafny vs Rust physical memory manager
        run: |
          bash scripts/test-pmm-differential.sh

      - name: Differential test Dafny vs Rust ring buffer
        run: |
          bash scripts/test-ring-buffer-differential.sh

      - name: Differential test Dafny vs Rust scheduler
        run: |
          bash scripts/test-scheduler-differential.sh

      - name: Differential test Dafny vs Rust task state
        run: |
          bash scripts/test-task-differential.sh

      - name: Build kernel
        run: |
          bash scripts/build-kernel.sh

      - name: Inspect preemption hook
        run: |
          HOOK_ADDR="$(nm -n build/rust.elf | awk '$3=="preempt_timer_tick" {print $1; exit}')"
          test -n "$HOOK_ADDR"
          START=$((16#$HOOK_ADDR))
          STOP=$((START + 128))
          objdump -d --start-address="$START" --stop-address="$STOP" build/rust.elf
          echo "preempt_timer_tick=$HOOK_ADDR"

      - name: Inspect preemption machine code
        run: |
          echo "Symbols near preemption"
          nm -n build/rust.elf | awk '$1 >= "0000000000011D00" && $1 <= "0000000000012000" {print}'
          echo "Disassembly around failing address"
          objdump -d --start-address=0x11e20 --stop-address=0x11f40 build/rust.elf
          echo "Preemption source symbols"
          nm -n build/rust.elf | awk '$1 >= "0000000000011E20" && $1 <= "0000000000011F40" {print}'

      - name: Validate binaries
        run: |
          test "$(stat -c%s build/boot.bin)" -eq 512
          test "$(stat -c%s build/kernel.bin)" -eq 40960
          test "$(stat -c%s build/kernel-qemu.bin)" -eq 40960
          test "$(od -An -tx1 -j510 -N2 build/boot.bin | tr -d ' \n')" = "55aa"

      - name: Create disk image
        run: |
          dd if=/dev/zero of=build/SafirOS.img bs=512 count=2880 status=none
          dd if=build/boot.bin of=build/SafirOS.img bs=512 seek=0 conv=notrunc status=none
          dd if=build/kernel.bin of=build/SafirOS.img bs=512 seek=1 conv=notrunc status=none
          test "$(stat -c%s build/SafirOS.img)" -eq 1474560

      - name: Test browser-style serial shell input under QEMU
        shell: bash
        run: |
          set -euo pipefail
          rm -f build/qemu-serial-monitor.sock

          qemu-system-x86_64 \
            -drive file=build/SafirOS.img,format=raw,if=floppy \
            -display none \
            -monitor unix:build/qemu-serial-monitor.sock,server=on,wait=off \
            -serial tcp:127.0.0.1:4555,server=on,wait=on \
            -no-reboot \
            -no-shutdown &
          qemu_pid=$!

          cleanup() {
            kill "$qemu_pid" 2>/dev/null || true
            wait "$qemu_pid" 2>/dev/null || true
            rm -f build/qemu-serial-monitor.sock
          }
          trap cleanup EXIT

          python3 - <<'PY'
          import socket
          import time

          serial = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          deadline = time.monotonic() + 10

          while True:
              try:
                  serial.connect(("127.0.0.1", 4555))
                  break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise SystemExit("QEMU serial console did not become available")
                  time.sleep(0.05)

          serial.settimeout(0.1)
          received = bytearray()

          def read_until(marker, timeout, start=0):
              deadline = time.monotonic() + timeout
              while received.find(marker, start) < 0:
                  if time.monotonic() >= deadline:
                      output = received.decode("ascii", errors="replace")
                      raise SystemExit(
                          f"Timed out waiting for {marker!r}. Serial output:\n{output}"
                      )

                  try:
                      chunk = serial.recv(4096)
                  except socket.timeout:
                      continue

                  if not chunk:
                      raise SystemExit("QEMU serial connection closed unexpectedly")

                  received.extend(chunk)

              return received.find(marker, start), received.decode("ascii", errors="replace")

          prompt_at, boot_output = read_until(b"safiros> ", 12)
          print(boot_output)
          print("Shell prompt reached.")

          for command, expected in [
              (b"help\r", b"Commands: help clear about echo"),
              (b"about\r", b"SafirOS x86-64 educational kernel"),
              (b"help\r", b"Commands: help clear about echo"),
          ]:
              command_start = len(received)

              for byte in command[:-1]:
                  input_start = len(received)
                  serial.sendall(bytes([byte]))
                  read_until(bytes([byte]), 2, input_start)

              response_start = len(received)
              serial.sendall(command[-1:])
              output_at, shell_output = read_until(expected, 5, response_start)
              prompt_at, shell_output = read_until(b"safiros> ", 5, output_at + len(expected))
              print(shell_output[command_start:].split("safiros> ", 1)[0])
              print("Characters echoed immediately; command completed and prompt returned.")

          command_start = len(received)

          for byte in b"helpX":
              input_start = len(received)
              serial.sendall(bytes([byte]))
              read_until(bytes([byte]), 2, input_start)

          backspace_start = len(received)
          serial.sendall(b"\x7f")
          read_until(b"\x08 \x08", 2, backspace_start)

          response_start = len(received)
          serial.sendall(b"\r")
          output_at, shell_output = read_until(
              b"Commands: help clear about echo",
              5,
              response_start
          )
          prompt_at, shell_output = read_until(
              b"safiros> ",
              5,
              output_at + len(b"Commands: help clear about echo")
          )
          print(shell_output[command_start:].split("safiros> ", 1)[0])
          print("DEL was handled as Backspace and the edited command executed.")

          serial.close()
          PY

      - name: Create QEMU disk image
        run: |
          dd if=/dev/zero of=build/SafirOS-qemu.img bs=512 count=2880 status=none
          dd if=build/boot-qemu.bin of=build/SafirOS-qemu.img bs=512 seek=0 conv=notrunc status=none
          dd if=build/kernel-qemu.bin of=build/SafirOS-qemu.img bs=512 seek=1 conv=notrunc status=none

      - name: Boot Rust kernel, Long Mode and PIT under QEMU
        shell: bash
        run: |
          set +e
          rm -f build/qemu-monitor.sock build/debugcon.log

          timeout 12s qemu-system-x86_64 \
            -drive file=build/SafirOS-qemu.img,format=raw,if=floppy \
            -display none \
            -monitor unix:build/qemu-monitor.sock,server=on,wait=off \
            -serial none \
            -no-reboot \
            -no-shutdown \
            -debugcon file:build/debugcon.log \
            -global isa-debugcon.iobase=0xe9 \
            -device isa-debug-exit,iobase=0xf4,iosize=0x01 &

          qemu_pid=$!

          python3 - <<'PY'
          import socket
          import time

          path = "build/qemu-monitor.sock"
          for _ in range(200):
              try:
                  sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  sock.connect(path)
                  break
              except OSError:
                  try:
                      sock.close()
                  except OSError:
                      pass
                  time.sleep(0.02)
          else:
              raise SystemExit("QEMU monitor socket was not available")

          sock.settimeout(1.0)
          try:
              sock.recv(4096)
          except OSError:
              pass

          deadline = time.time() + 2.0
          while time.time() < deadline:
              try:
                  with open("build/debugcon.log", "rb") as log:
                      trace = log.read()
              except FileNotFoundError:
                  trace = b""

              if b"R" in trace:
                  break

              time.sleep(0.005)
          else:
              sock.close()
              raise SystemExit("preemption bootstrap marker R was not observed")

          def read_trace():
              try:
                  with open("build/debugcon.log", "rb") as log:
                      return log.read()
              except FileNotFoundError:
                  return b""

          key_received = False
          for attempt in range(3):
              sock.sendall(b"sendkey a 250\n")
              deadline = time.time() + 1.0
              while time.time() < deadline:
                  trace = read_trace()
                  if b"K" in trace:
                      key_received = True
                      break
                  if b"F" in trace or b"Q" in trace:
                      break
                  time.sleep(0.005)

              if key_received:
                  break

              if b"F" in read_trace() or b"Q" in read_trace():
                  break

          sock.close()

          if not key_received:
              raise SystemExit("QEMU keyboard input was not observed after 3 attempts")
          PY

          wait "$qemu_pid"
          rc=$?
          set -e

          echo "QEMU exit code: $rc"
          echo "debugcon output:"
          cat build/debugcon.log 2>/dev/null || true

          test "$rc" -eq 33
          test -f build/debugcon.log

          trace="$(tr -d "\n" < build/debugcon.log)"
          boot_trace="${trace#B1234}"
          preemption_trace="${boot_trace//K/}"
          preemption_trace="${preemption_trace//V/}"

          test "$(tr -cd "K" < build/debugcon.log | wc -c)" -eq 1
          test "$(tr -cd "V" < build/debugcon.log | wc -c)" -eq 1
          case "$boot_trace" in
            PICHSJR*K*V*Q) ;;
            *)
              echo "Keyboard input path did not complete: $trace"
              exit 1
              ;;
          esac

          test "$preemption_trace" = "PICHSJRTBTATBTATBTATBTAQ"
