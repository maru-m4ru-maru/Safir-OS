name: Build SafirOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Build and check SafirOS image
        run: make check

      - name: Upload SafirOS image
        uses: actions/upload-artifact@v4
        with:
          name: SafirOS
          path: build/SafirOS.img
