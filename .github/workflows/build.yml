name: Build SafirOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Build bootloader
        run: |
          mkdir -p build
          nasm -f bin boot/boot.asm -o build/boot.bin

      - name: Build kernel
        run: |
          nasm -f bin kernel/kernel.asm -o build/kernel.bin

      - name: Check bootloader and kernel
        run: |
          test "$(stat -c%s build/boot.bin)" -eq 512
          test "$(stat -c%s build/kernel.bin)" -eq 1024

      - name: Create SafirOS image
        run: |
          dd \
            if=/dev/zero \
            of=build/SafirOS.img \
            bs=512 \
            count=2880

          dd \
            if=build/boot.bin \
            of=build/SafirOS.img \
            bs=512 \
            seek=0 \
            conv=notrunc

          dd \
            if=build/kernel.bin \
            of=build/SafirOS.img \
            bs=512 \
            seek=1 \
            conv=notrunc

      - name: Check files
        run: |
          ls -lh build/

          test "$(stat -c%s build/boot.bin)" -eq 512
          test "$(stat -c%s build/kernel.bin)" -eq 1024
          test "$(stat -c%s build/SafirOS.img)" -eq 1474560

      - name: Upload SafirOS image
        uses: actions/upload-artifact@v4
        with:
          name: SafirOS
          path: build/SafirOS.img
