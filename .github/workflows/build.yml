name: Build SafirOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86

      - name: Build bootloader
        run: |
          mkdir -p build
          nasm -f bin boot/boot.asm -o build/boot.bin

      - name: Build kernel
        run: |
          nasm -f bin kernel/kernel.asm -o build/kernel.bin

      - name: Validate binaries
        run: |
          test "$(stat -c%s build/boot.bin)" -eq 512
          test "$(stat -c%s build/kernel.bin)" -eq 8192
          test "$(od -An -tx1 -j510 -N2 build/boot.bin | tr -d ' \\n')" = "55aa"

      - name: Create disk image
        run: |
          dd if=/dev/zero of=build/SafirOS.img bs=512 count=2880 status=none
          dd if=build/boot.bin of=build/SafirOS.img bs=512 seek=0 conv=notrunc status=none
          dd if=build/kernel.bin of=build/SafirOS.img bs=512 seek=1 conv=notrunc status=none
          test "$(stat -c%s build/SafirOS.img)" -eq 1474560

      - name: Build QEMU test kernel
        run: |
          nasm -dSAFIROS_QEMU_TEST -f bin kernel/kernel.asm -o build/kernel-qemu.bin
          test "$(stat -c%s build/kernel-qemu.bin)" -eq 8192
          dd if=/dev/zero of=build/SafirOS-qemu.img bs=512 count=2880 status=none
          dd if=build/boot.bin of=build/SafirOS-qemu.img bs=512 seek=0 conv=notrunc status=none
          dd if=build/kernel-qemu.bin of=build/SafirOS-qemu.img bs=512 seek=1 conv=notrunc status=none

      - name: Boot Long Mode and PIT under QEMU
        shell: bash
        run: |
          set +e
          timeout 12s qemu-system-x86_64 \
            -drive file=build/SafirOS-qemu.img,format=raw,if=floppy \
            -display none \
            -monitor none \
            -serial none \
            -no-reboot \
            -no-shutdown \
            -debugcon file:build/debugcon.log \
            -global isa-debugcon.iobase=0xe9 \
            -device isa-debug-exit,iobase=0xf4,iosize=0x01
          rc=$?
          set -e

          test "$rc" -eq 33
          test -f build/debugcon.log
          grep -q "PLIT" build/debugcon.log
