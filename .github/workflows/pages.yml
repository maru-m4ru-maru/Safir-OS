name: Build and Deploy SafirOS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Build bootloader
        run: |
          mkdir -p build
          nasm -f bin boot/boot.asm -o build/boot.bin

      - name: Build kernel
        run: |
          nasm -f bin kernel/kernel.asm -o build/kernel.bin

      - name: Check bootloader and kernel
        run: |
          test "$(stat -c%s build/boot.bin)" -eq 512
          test "$(stat -c%s build/kernel.bin)" -eq 1024

      - name: Create SafirOS image
        run: |
          mkdir -p site

          dd \
            if=/dev/zero \
            of=site/SafirOS.img \
            bs=512 \
            count=2880

          dd \
            if=build/boot.bin \
            of=site/SafirOS.img \
            bs=512 \
            seek=0 \
            conv=notrunc

          dd \
            if=build/kernel.bin \
            of=site/SafirOS.img \
            bs=512 \
            seek=1 \
            conv=notrunc

      - name: Check SafirOS image
        run: |
          test "$(stat -c%s site/SafirOS.img)" -eq 1474560

      - name: Copy website
        run: |
          cp web/index.html site/index.html
          cp web/style.css site/style.css
          cp web/app.js site/app.js
          cp favicon.svg site/favicon.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
