name: Build and Deploy SafirOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: safiros-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils lld

      - name: Build bootloader
        run: |
          mkdir -p build
          nasm -f bin boot/boot.asm -o build/boot.bin

      - name: Build kernel
        run: |
          bash scripts/build-kernel.sh

      - name: Validate binaries
        run: |
          test "$(stat -c%s build/boot.bin)" -eq 512
          test "$(stat -c%s build/kernel.bin)" -eq 32768
          test "$(od -An -tx1 -j510 -N2 build/boot.bin | tr -d ' \\n')" = "55aa"

      - name: Create SafirOS image
        run: |
          mkdir -p site
          dd if=/dev/zero of=site/SafirOS.img bs=512 count=2880 status=none
          dd if=build/boot.bin of=site/SafirOS.img bs=512 seek=0 conv=notrunc status=none
          dd if=build/kernel.bin of=site/SafirOS.img bs=512 seek=1 conv=notrunc status=none
          test "$(stat -c%s site/SafirOS.img)" -eq 1474560

      - name: Fetch browser emulator
        run: |
          mkdir -p site/qemu
          curl -fL "https://raw.githubusercontent.com/kannaka-labs/QuantumOS/59d3a13501cec3e3c30a2749f9efa9a361e3bf79/web/qemu/out.js" -o site/qemu/out.js
          curl -fL "https://raw.githubusercontent.com/kannaka-labs/QuantumOS/59d3a13501cec3e3c30a2749f9efa9a361e3bf79/web/qemu/qemu-system-x86_64.worker.js" -o site/qemu/qemu-system-x86_64.worker.js
          curl -fL "https://raw.githubusercontent.com/kannaka-labs/QuantumOS/59d3a13501cec3e3c30a2749f9efa9a361e3bf79/web/qemu/load-rom.data" -o site/qemu/load-rom.data
          curl -fL "https://ktock.github.io/qemu-wasm-demo/images/alpine-x86_64/qemu-system-x86_64.wasm" -o site/qemu/qemu-system-x86_64.wasm
          echo "f53107a35029d676aa551cd00d042f4f65af39a89bf72464494321fafdf54191  site/qemu/qemu-system-x86_64.wasm" | sha256sum -c -

      - name: Copy website
        run: |
          cp web/index.html site/index.html
          cp web/style.css site/style.css
          cp web/app.js site/app.js
          cp web/coi-serviceworker.js site/coi-serviceworker.js
          cp web/qemu/xterm-pty.js site/qemu/xterm-pty.js
          cp web/qemu/load-rom.js site/qemu/load-rom.js
          cp web/safiros-logo.svg site/safiros-logo.svg
          cp favicon.svg site/favicon.svg

      - name: Verify website files
        run: |
          test -f site/index.html
          test -f site/app.js
          test -f site/coi-serviceworker.js
          test -f site/qemu/xterm-pty.js
          test -f site/qemu/load-rom.js
          test -f site/qemu/out.js
          test -f site/qemu/qemu-system-x86_64.worker.js
          test -f site/qemu/load-rom.data
          test -f site/qemu/qemu-system-x86_64.wasm
          test -f site/SafirOS.img
          test -f site/favicon.svg
          find site -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
