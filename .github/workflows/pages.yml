name: Build and Deploy SafirOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Build bootloader
        run: |
          mkdir -p build
          nasm -f bin boot/boot.asm -o build/boot.bin

      - name: Build kernel
        run: |
          nasm -f bin kernel/kernel.asm -o build/kernel.bin

      - name: Pad kernel
        run: |
          dd if=build/kernel.bin \
             of=build/kernel-sector.bin \
             bs=512 \
             conv=sync

      - name: Create SafirOS image
        run: |
          mkdir -p site
          cat build/boot.bin build/kernel-sector.bin > site/SafirOS.img

      - name: Check image
        run: |
          ls -lh site/SafirOS.img
          test "$(stat -c%s site/SafirOS.img)" -eq 1024

      - name: Copy website
        run: |
          cp web/index.html site/index.html
          cp web/style.css site/style.css
          cp web/app.js site/app.js
          cp favicon.svg site/favicon.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
