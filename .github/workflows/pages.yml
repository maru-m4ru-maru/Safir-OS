name: Build and Deploy SafirOS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Build and check SafirOS image
        run: make check

      - name: Prepare Pages files
        run: |
          mkdir -p site
          cp build/SafirOS.img site/SafirOS.img
          cp web/index.html site/index.html
          cp web/style.css site/style.css
          cp web/app.js site/app.js
          cp favicon.svg site/favicon.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
