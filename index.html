<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafirOS</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: monospace;
    }

    body {
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    #screen_container {
      width: 100%;
      max-width: 1024px;
      min-height: 480px;
      margin: 0 auto;
      background: #000;
      overflow: hidden;
    }

    #screen_container > div {
      white-space: pre;
      font: 14px monospace;
      line-height: 14px;
    }

    #screen_container canvas {
      display: none;
      max-width: 100%;
    }
  </style>

  <script src="https://copy.sh/v86/build/libv86.js"></script>
</head>

<body>

  <h1>SafirOS</h1>

  <div id="screen_container">
    <div></div>
    <canvas></canvas>
  </div>

  <script>
    "use strict";

    window.addEventListener("load", function () {
      const screenContainer =
        document.getElementById("screen_container");

      const canvas =
        screenContainer.querySelector("canvas");

      window.emulator = new V86({
        wasm_path:
          "https://copy.sh/v86/build/v86.wasm",

        memory_size: 16 * 1024 * 1024,

        vga_memory_size:
          2 * 1024 * 1024,

        screen_container:
          screenContainer,

        canvas: canvas,

        bios: {
          url:
            "https://copy.sh/v86/bios/seabios.bin"
        },

        vga_bios: {
          url:
            "https://copy.sh/v86/bios/vgabios.bin"
        },

        fda: {
          url: "SafirOS.img"
        },

        autostart: true
      });
    });
  </script>

</body>
</html>
