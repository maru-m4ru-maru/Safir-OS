<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SafirOS</title>

  <link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
  <link rel="shortcut icon" href="favicon.svg?v=3">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: monospace;
    }

    body {
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    #status {
      margin-bottom: 16px;
      padding: 10px;
      background: #181818;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    #progress {
      width: 100%;
      max-width: 600px;
      height: 18px;
      margin-bottom: 8px;
      background: #333;
      border-radius: 999px;
      overflow: hidden;
    }

    #progress_bar {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width 0.15s ease;
    }

    #progress_text {
      margin-bottom: 16px;
    }

    #screen_container {
      width: 100%;
      max-width: 960px;
      min-height: 420px;
      margin: 0 auto;
      background: #000;
      overflow: hidden;
    }

    #screen_container > div {
      white-space: pre;
      font-family: monospace;
      font-size: 16px;
      line-height: 20px;
      padding: 8px;
      box-sizing: border-box;
    }

    #screen_container canvas {
      display: none;
      max-width: 100%;
      image-rendering: pixelated;
    }

    .ok {
      color: #7cff7c;
    }

    .error {
      color: #ff7070;
    }

    .info {
      color: #fff;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/v86@0.5.458/build/libv86.js"></script>
</head>

<body>

  <h1>SafirOS</h1>

  <div id="status" class="info">
    SafirOS.img を確認しています...
  </div>

  <div id="progress">
    <div id="progress_bar"></div>
  </div>

  <div id="progress_text">0%</div>

  <div id="screen_container">
    <div></div>
    <canvas></canvas>
  </div>

  <script>
    "use strict";

    const status =
      document.getElementById("status");

    const progressBar =
      document.getElementById("progress_bar");

    const progressText =
      document.getElementById("progress_text");

    const screenContainer =
      document.getElementById("screen_container");

    function setStatus(message, className) {
      status.textContent = message;
      status.className = className || "info";
    }

    function setProgress(percent) {
      const value =
        Math.max(0, Math.min(100, percent));

      progressBar.style.width =
        value + "%";

      progressText.textContent =
        Math.round(value) + "%";
    }

    async function loadSafirOSImage() {
      const imageUrl = "SafirOS.img";

      setStatus(
        "① SafirOS.img を取得しています...",
        "info"
      );

      setProgress(0);

      const response = await fetch(
        imageUrl + "?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          "SafirOS.img の取得に失敗しました。\n" +
          "HTTP " + response.status
        );
      }

      const total =
        Number(
          response.headers.get("Content-Length")
        ) || 1024;

      if (!response.body) {
        const buffer =
          await response.arrayBuffer();

        setProgress(100);

        return buffer;
      }

      const reader =
        response.body.getReader();

      const chunks = [];
      let received = 0;

      while (true) {
        const result =
          await reader.read();

        if (result.done) {
          break;
        }

        chunks.push(result.value);
        received += result.value.length;

        const percent =
          total > 0
            ? (received / total) * 100
            : 0;

        setProgress(percent);
      }

      const buffer =
        new Uint8Array(received);

      let offset = 0;

      for (const chunk of chunks) {
        buffer.set(chunk, offset);
        offset += chunk.length;
      }

      setProgress(100);

      return buffer.buffer;
    }

    async function startSafirOS() {
      try {
        const imageBuffer =
          await loadSafirOSImage();

        const size =
          imageBuffer.byteLength;

        if (size !== 1024) {
          throw new Error(
            "SafirOS.img のサイズが1024バイトではありません。\n" +
            "実際: " + size + " bytes"
          );
        }

        setStatus(
          "① SafirOS.img: HTTP 200 OK\n" +
          "② サイズ: 1024 bytes\n" +
          "③ 読み込み完了\n" +
          "④ v86 を起動しています...",
          "ok"
        );

        window.emulator =
          new V86({
            wasm_path:
              "https://cdn.jsdelivr.net/npm/v86@0.5.458/build/v86.wasm",

            memory_size:
              16 * 1024 * 1024,

            vga_memory_size:
              2 * 1024 * 1024,

            screen_container:
              screenContainer,

            bios: {
              url:
                "https://raw.githubusercontent.com/copy/v86/master/bios/seabios.bin"
            },

            vga_bios: {
              url:
                "https://raw.githubusercontent.com/copy/v86/master/bios/vgabios.bin"
            },

            fda: {
              buffer: imageBuffer
            },

            boot_order: 0x321,

            disable_speaker: true,

            autostart: true
          });

        setStatus(
          "① SafirOS.img: HTTP 200 OK\n" +
          "② サイズ: 1024 bytes\n" +
          "③ イメージ取得OK\n" +
          "④ v86 起動中...\n" +
          "⑤ SafirOS を起動しています...",
          "ok"
        );

        window.emulator.add_listener(
          "emulator-ready",
          function () {
            setStatus(
              "v86 準備完了\n" +
              "SafirOS.img 読み込み完了\n" +
              "SafirOS 起動中...",
              "ok"
            );
          }
        );

      } catch (error) {
        console.error(error);

        setStatus(
          "エラー\n\n" +
          error.message,
          "error"
        );

        setProgress(0);
      }
    }

    window.addEventListener(
      "load",
      startSafirOS
    );
  </script>

</body>
</html>
